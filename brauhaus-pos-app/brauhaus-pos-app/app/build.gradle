plugins { id 'com.android.application' }

android {
    namespace 'com.lockandkeyhome.brauhauspos'
    compileSdk 34
    defaultConfig {
        applicationId 'com.lockandkeyhome.brauhauspos'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // iMin built-in printer SDK (v1.0 line, Android 11 devices such as the Swift 1)
    implementation 'com.github.iminsoftware:IminPrinterLibrary:V1.0.0.15'
}

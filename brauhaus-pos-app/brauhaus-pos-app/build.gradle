plugins { id 'com.android.application' }

android {
    namespace 'com.lockandkeyhome.brauhauspos'
    compileSdk 34
    defaultConfig {
        applicationId 'com.lockandkeyhome.brauhauspos'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.3.2'
    }
    // One fixed signing key, so every build installs over the last one.
    signingConfigs {
        shared {
            storeFile file('brauhaus.keystore')
            storePassword 'brauhauspos'
            keyAlias 'brauhaus'
            keyPassword 'brauhauspos'
        }
    }
    buildTypes {
        debug   { signingConfig signingConfigs.shared }
        release { signingConfig signingConfigs.shared; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    // Sunmi built-in printer service (Maven Central)
    implementation 'com.sunmi:printerlibrary:1.0.24'
    // iMin printer SDK (JitPack)
    implementation 'com.github.iminsoftware:IminPrinterLibrary:V1.0.0.15'
    // QR scanner for cashless cards (Maven Central)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
